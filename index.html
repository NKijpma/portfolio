<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- mobile layout -->
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Portfolio</title>

    <!-- ico -->
    <link href="images/pfp.png" rel="icon" type="image/png">

    <!-- font -->
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">

    <!-- root & index -->
    <link href="css/root.css" rel="stylesheet">
    <link href="css/animations.css" rel="stylesheet">
    <link href="css/cursor.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">

    <!-- css -->
    <link href="css/navbar.css" rel="stylesheet">
    <link href="css/header.css" rel="stylesheet">
    <link href="css/footer.css" rel="stylesheet">

    <link href="css/container-top.css" rel="stylesheet">
    <link href="css/container-center.css" rel="stylesheet">
    <link href="css/carrousel.css" rel="stylesheet">
</head>
<body>
<div class="custom-cursor"></div>

<!-- navigation-bar -->
<nav>

    <div id="theme-switcher" onclick="toggleTheme()"></div>

    <div id="navigation">
        <a class="nav-link" href="#home"></a>
        <a class="nav-link" href="#information">󰋼</a>
        <a class="nav-link" href="#experience"></a>
        <a class="nav-link" href="#projects">󱉟</a>
        <a class="nav-link" href="#hobbies"></a>
        <a class="nav-link" href="#internship"></a>
    </div>

    <a href="https://github.com/NKijpma" id="github" target="_blank"><span id="github-icon"></span><span
            id="github-name">NKijpma</span></a>
</nav>

<!-- home-page -->
<header id="home">
    <div id="header-title">NKIJPMA<span id="dot">.</span></div>
    <img alt="" id="wheel" src="images/icons/.png">
</header>

<!-- main-content -->
<div id="container-top">

    <div id="information">
        <div class="title">Who am I?<br>
            <img alt="profile picture" id="pfp" src="images/pfp.png">
        </div>
        <div class="text">
            Name: NKijpma <br>
            Age: <span id="age"></span><br>
            Nationality: Netherlands <br>
            Birthday: 05-07-2008 <br>
        </div>
    </div>

    <div id="experience">
        <div class="title">My experience</div>
        <div id="experience-container">
            <div class="experience-bars">
                <div class="bar" id="html-bar"><span>HTML</span></div>
            </div>
            <div class="experience-bars">
                <div class="bar" id="css-bar"><span>CSS</span></div>
            </div>
            <div class="experience-bars">
                <div class="bar" id="js-bar"><span>JS</span></div>
            </div>
            <div class="experience-bars">
                <div class="bar" id="py-bar"><span>PY</span></div>
            </div>
            <div class="experience-bars">
                <div class="bar" id="csharp-bar"><span>C#</span></div>
            </div>
            <div class="experience-bars">
                <div class="bar" id="php-bar"><span>PHP</span></div>
            </div>
            <div class="experience-bars">
                <div class="bar" id="sql-bar"><span>SQL</span></div>
            </div>
        </div>
    </div>

</div>

<div id="container-center">

    <div id="projects">

        <div id="slider-wrapper">

            <div id="slider">
                <img alt="" class="slide-1 slide" id="slide-1" src="images/projects/city.gif">
                <img alt="" class="slide-2 slide" id="slide-2" src="images/projects/ds.jpg">
                <img alt="" class="slide-3 slide" id="slide-3" src="images/projects/FLCL.png">
                <img alt="" class="slide-4 slide" id="slide-4" src="images/projects/train.gif">
                <img alt="" class="slide-5 slide" id="slide-5" src="images/projects/hiker.jpg">
                <img alt="" class="slide-6 slide" id="slide-6" src="images/projects/nature.jpg">

                <img alt="" aria-hidden="true" src="images/projects/city.gif">
            </div>

            <div id="slider-nav">
                <a href="#slide-1"></a>
                <a href="#slide-2"></a>
                <a href="#slide-3"></a>
                <a href="#slide-4"></a>
                <a href="#slide-5"></a>
                <a href="#slide-6"></a>
            </div>

        </div>

    </div>

    <div id="hobbies"></div>

</div>

<div id="container-bottom">

    <div id="internship">
        <div class="title"></div>
        <div class="text"></div>
    </div>

</div>

<footer>
    <div id="CV-download">󰥥</div>
</footer>

<script defer src="js/custom-cursor.js"></script>
<script defer src="js/theme-switcher.js"></script>
<script defer src="js/carrousel.js"></script>
<script defer src="js/age.js"></script>
</body>
</html>
